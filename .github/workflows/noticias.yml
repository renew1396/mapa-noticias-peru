# Lee los RSS, ubica y clasifica las noticias, las guarda y publica el sitio.
# Programada cada hora (a los :23, fuera de la hora punta de GitHub). GitHub suele saltarse ejecuciones
# programadas, así que en la práctica corre cada 1–3 horas. Si falla, GitHub avisa por correo.
name: Noticias

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escribe-datos
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cambio: ${{ steps.guardar.outputs.cambio }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leer RSS y ubicar noticias
        run: python -m pipeline.ingest
      - name: Guardar
        id: guardar
        run: |
          git config user.name "robot-mapa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "cambio=no" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "Noticias: actualización automática $(date -u +%Y-%m-%dT%H:%MZ)"
            # GitHub a veces rechaza un push por un error suyo pasajero: reintentar hasta 3 veces.
            for intento in 1 2 3; do
              if git pull --rebase -q && git push -q; then break; fi
              if [ "$intento" = 3 ]; then echo "::error::No se pudo guardar tras 3 intentos"; exit 1; fi
              sleep $((intento * 20))
            done
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: ingesta
    if: needs.ingesta.outputs.cambio == 'si'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
