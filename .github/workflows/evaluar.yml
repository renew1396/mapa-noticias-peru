# Mide la calidad del geoparsing contra el set de prueba (data/eval/set.jsonl).
# Se lanza a mano: Actions › "Evaluar geoparsing" › Run workflow. El resultado aparece en el resumen de la ejecución.
name: Evaluar geoparsing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.evaluar
