# Compila la web y la publica en GitHub Pages.
# Se ejecuta al cambiar web/ o data/ en main, a mano, o llamada desde otras
# tareas (noticias, ETL), porque los commits del robot no disparan otras tareas.
name: Publicar sitio

on:
  push:
    branches: [main]
    paths: ["web/**", "data/layers/**", "data/news/**", "data/status/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read   # también alcanza para bajar archivos de releases
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # siempre la última versión, incluidos los datos recién guardados
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Agregar capas pesadas (archivos de la release "capas")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download capas --repo "$GITHUB_REPOSITORY" --pattern "*.pmtiles" --dir web/dist/data/layers --clobber \
            || echo "::warning::No se pudo bajar la release 'capas': el mapa saldrá sin concesiones mineras."
          ls -la web/dist/data/layers
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
