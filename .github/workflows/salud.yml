# Chequeo de salud diario (07:40 hora de Lima). Si algo falla, la tarea queda en rojo y GitHub avisa por correo.
# Qué revisa: ver pipeline/salud.py. Qué hacer: ver RUNBOOK.md.
name: Chequeo de salud

on:
  schedule:
    - cron: "40 12 * * *"
  workflow_dispatch:
    inputs:
      probar_aviso:
        description: "Fallar a propósito para comprobar que llega el correo de aviso"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  salud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prueba del aviso por correo
        if: inputs.probar_aviso
        run: |
          echo "## Prueba del aviso: esta ejecución falla a propósito. Si te llegó el correo, el aviso funciona." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - run: python -m pipeline.salud
