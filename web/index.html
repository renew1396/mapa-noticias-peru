<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2a37" />
    <title>Mapa de noticias del Perú</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='13' r='8' fill='%23c2410c'/%3E%3Cpath d='M16 30 9 18h14z' fill='%23c2410c'/%3E%3Ccircle cx='16' cy='13' r='3' fill='white'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="marca">
        <h1>Mapa de noticias del Perú</h1>
        <span id="estado" class="estado" aria-live="polite">Cargando…</span>
      </div>
      <button id="abrir-filtros" class="boton-barra" aria-expanded="false" aria-controls="filtros">
        Filtros <span id="resumen-filtros" class="chip-mini">7 días</span>
      </button>
    </header>

    <section id="filtros" class="panel-filtros" hidden aria-label="Filtros de noticias">
      <fieldset>
        <legend>Período</legend>
        <div class="segmentado" role="radiogroup" id="filtro-dias">
          <button role="radio" aria-checked="true" data-dias="7">7 días</button>
          <button role="radio" aria-checked="false" data-dias="30">30 días</button>
          <button role="radio" aria-checked="false" data-dias="90">90 días</button>
        </div>
      </fieldset>
      <label>Tema <select id="filtro-tema"><option value="">Todos los temas</option></select></label>
      <label>Medio <select id="filtro-medio"><option value="">Todos los medios</option></select></label>
      <div id="leyenda" class="leyenda" aria-label="Colores por tema"></div>
      <p class="nota">Toca el mapa para ver las noticias de una zona. Los pines son noticias ubicadas en un distrito o
        centro poblado; las que solo mencionan una provincia o región aparecen en la lista de la zona.</p>
    </section>

    <main id="mapa" aria-label="Mapa del Perú"></main>

    <section id="ficha" class="ficha" hidden aria-live="polite">
      <button id="cerrar-ficha" class="cerrar" aria-label="Cerrar ficha">×</button>
      <div id="ficha-contenido"></div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
