# Temas de las noticias (lista cerrada). Cada tema tiene palabras clave SIN tildes y en
# minúsculas; se buscan como palabras o frases completas en título + resumen.
# Una noticia puede tener hasta 2 temas; el primero (más coincidencias) es el principal.
# El color se usa en el mapa (paleta apta para daltónicos).
# "otros" se asigna cuando no coincide ninguno.

