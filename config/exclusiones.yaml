# Reglas para evitar falsos positivos del geoparsing (Nivel 1). Todo SIN tildes y en minúsculas.
# Las correcciones del botón "Revisar con IA" (Fase 5) agregarán entradas aquí.

# Frases que NO son lugares aunque contengan uno (clubes, personas, instituciones, calles famosas).
# Se borran del texto antes de buscar lugares.
frases_excluidas:
  # clubes y deporte
  - alianza lima
  - sporting cristal
  - deportivo municipal
  - sport boys
  - fbc melgar
  - real garcilaso
  - cusco fc
  - adt de tarma
  - ayacucho fc
  - comerciantes unidos
  - union comercio
  - atletico grau
  - juan pablo ii college
  - copa libertadores
  # personas que llevan nombre de lugar
  - miguel grau
  - almirante grau
  - simon bolivar
  - jose de san martin
  - francisco bolognesi
  - ramon castilla
  - antonio jose de sucre
  - jorge basadre
  - leoncio prado
  - mariano melgar
  - andres avelino caceres
  - jose carlos mariategui
  - jose maria arguedas
  - maria parado de bellido
  # instituciones y lugares de Lima con nombre de otro sitio
  - san marcos
  - unmsm
  - universidad san martin de porres
  - universidad nacional de san martin
  - universidad de lima
  - plaza san martin
  - plaza grau
  - plaza bolognesi
  - palacio de gobierno
