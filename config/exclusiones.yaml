  - hospital loayza
  # nombres de otros países que coinciden con lugares del Perú
  - santa cruz de la sierra
  - santiago de chile
  - concepcion chile
  - asuncion paraguay
  - la paz bolivia
  - jaen espana

# Palabras que, si van JUSTO ANTES de un nombre, indican una calle u otra cosa: no es el lugar.
# (también se revisa "<prefijo> de <lugar>": "colegio de Piura").
prefijos_calle: [avenida, av, jiron, jr, calle, pasaje, psje, ovalo, malecon, alameda, prolongacion, prol,
                 cuadra, urbanizacion, urb, colegio, club, coliseo, estadio, universidad, hotel, restaurante, ie,
                 institucion educativa, mercado, parque, plaza]

