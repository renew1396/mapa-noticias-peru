                     este, oeste, centro, metropolitana, provincias, alto, bajo, gran, nuevo, nueva, villa, puerto,
                     ciudad, lago, rio, valle, cerro, playa, provincia, distrito, ugel, diresa, geresa, sutep, una,
                     unsa, unsaac, unp, corte, fiscalia, pnp, dre, gore]

