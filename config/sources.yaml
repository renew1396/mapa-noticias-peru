  - {id: larepublica-politica, nombre: La República, url: "https://larepublica.pe/rss/politica.xml", tipo: nacional}
  - {id: correo, nombre: Correo, url: "https://diariocorreo.pe/arcio/rss/", tipo: nacional}
  - {id: gestion, nombre: Gestión, url: "https://gestion.pe/arcio/rss/", tipo: nacional}
