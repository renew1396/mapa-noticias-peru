# Medios con RSS. Para agregar uno: copiar un bloque, cambiar id/nombre/url y,
# si es regional, poner los códigos de departamento (2 dígitos del ubigeo) en `departamentos`.
# Para quitar uno sin borrarlo: `activo: false`.
#
# Códigos de departamento: 01 Amazonas · 02 Áncash · 03 Apurímac · 04 Arequipa · 05 Ayacucho
# 06 Cajamarca · 07 Callao · 08 Cusco · 09 Huancavelica · 10 Huánuco · 11 Ica · 12 Junín
# 13 La Libertad · 14 Lambayeque · 15 Lima · 16 Loreto · 17 Madre de Dios · 18 Moquegua
# 19 Pasco · 20 Piura · 21 Puno · 22 San Martín · 23 Tacna · 24 Tumbes · 25 Ucayali
#
# `departamentos` es solo una PISTA para desempatar nombres repetidos (p. ej. "San Juan"):
# varios medios regionales republican noticias de otras regiones.
# Verificados el 2026-10-19 (ver SOURCES.md).

# Secciones (primer o segundo tramo de la URL) que no tienen territorio y se descartan.
secciones_excluidas:
  - deportes
  - deporte-total
  - futbol
  - mag
  - respuestas
  - espectaculos
  - farandula
  - luces
  - cine
  - cine-series
  - tvmas
  - musica
  - somos
  - mundo
  - internacional
  - internacionales
  - opinion
  - miscelanea
  - mix
  - g-de-gestion
  - tecnologia
  - virales
  - horoscopo
  - loterias
  - gastronomia
  - no-flujo
  - usa
  - mexico
  - colombia
  - argentina
  - videos
  - podcast

# Titulares que se descartan (expresiones regulares, sin distinguir mayúsculas): portadas y ediciones.
titulos_excluidos:
  - '^diario .{0,40}\d{1,2}/\d{1,2}/\d{2,4}'
  - '^la prensa regional\s*[–-]'
  - '^semanario '
  - '^\d+\s*-\s*\d+$'

# Correo publica ediciones regionales en /edicion/<region>/: se usa como pista.
pistas_url:
  "/edicion/arequipa/": ["04"]
  "/edicion/ayacucho/": ["05"]
  "/edicion/cajamarca/": ["06"]
  "/edicion/chimbote/": ["02"]
  "/edicion/huaraz/": ["02"]
  "/edicion/cusco/": ["08"]
  "/edicion/huancavelica/": ["09"]
  "/edicion/huanuco/": ["10"]
  "/edicion/ica/": ["11"]
  "/edicion/huancayo/": ["12"]
  "/edicion/la-libertad/": ["13"]
  "/edicion/lambayeque/": ["14"]
  "/edicion/lima/": ["15", "07"]
  "/edicion/piura/": ["20"]
  "/edicion/puno/": ["21"]
  "/edicion/tacna/": ["23"]
  "/edicion/tumbes/": ["24"]

